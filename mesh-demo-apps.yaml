---
# 1. Customer (Frontend) Service & Deployment
apiVersion: v1
kind: Service
metadata:
  name: customer
  namespace: mesh-demo
  labels:
    app: customer
spec:
  ports:
  - port: 8080
    name: http
  selector:
    app: customer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-v1
  namespace: mesh-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer
      version: v1.1
  template:
    metadata:
      labels:
        app: customer
        version: v1.1
      annotations:
        sidecar.istio.io/proxyCPU: "10m"
        sidecar.istio.io/proxyMemory: "64Mi"
    spec:
      containers:
      - name: customer
        image: quay.io/rhdevelopers/istio-tutorial-customer:v1.1
        ports:
        - containerPort: 8080
---
